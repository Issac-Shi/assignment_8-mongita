{% extends 'base.html' %}

{% block container %}
<main class="formPage">
    <section class="formCard">
        <h2>Edit Book</h2>
        <p class="formIntro">
            Update the selected book. Current values are pre-filled from Mongita.
        </p>

        <form method="POST" action="{{ url_for('edit_post', id=book['bookId']) }}" class="bookForm">
            <label for="title">Title</label>
            <input id="title" type="text" name="title" value="{{ book['title'] }}" required>

            <label for="author">Author</label>
            <input id="author" type="text" name="author" value="{{ book['author'] }}" required>

            <label for="isbn">ISBN</label>
            <input id="isbn" type="text" name="isbn" value="{{ book['isbn'] }}" required>

            <label for="price">Price</label>
            <input id="price" type="number" step="0.01" min="0" name="price" value="{{ book['price'] }}" required>

            <label for="categoryId">Category</label>
            <select id="categoryId" name="categoryId" required>
                {% for category in categories %}
                    <option
                        value="{{ category['categoryId'] }}"
                        {% if category['categoryId'] == book['categoryId'] %}selected{% endif %}
                    >
                        {{ category['categoryName'] }}
                    </option>
                {% endfor %}
            </select>

            <label for="image">Image filename</label>
            <input id="image" type="text" name="image" value="{{ book['image'] }}" required>

            <label for="readNow">Read Now</label>
            <select id="readNow" name="readNow" required>
                <option value="0" {% if book['readNow'] == 0 %}selected{% endif %}>0 - No</option>
                <option value="1" {% if book['readNow'] == 1 %}selected{% endif %}>1 - Yes</option>
            </select>

            <div class="formButtons">
                <button type="submit" class="submitButton">Save Changes</button>
                <a class="cancelButton" href="{{ url_for('read') }}">Cancel</a>
            </div>
        </form>
    </section>
</main>
{% endblock %}
